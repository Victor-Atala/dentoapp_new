<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Care - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Fondo Animado -->
    <div class="area"><ul class="circles"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul></div>
    
    <!-- Navbar Dinámica -->
    <div id="navbar-placeholder"></div>

    <main class="container">
        <div class="row">
            <!-- Columna Izquierda: Info Usuario -->
            <div class="col-lg-4">
                <div class="custom-card p-0 overflow-hidden text-center">
                    <div class="profile-header-bg"></div>
                    <div class="profile-avatar"><i class="fas fa-user"></i></div>
                    <div class="p-4">
                        <h4 id="profile-name">Cargando...</h4>
                        <p class="text-muted mb-3" id="profile-email">email@ejemplo.com</p>
                        <div class="d-grid gap-2">
                            <button class="btn btn-info text-white rounded-pill" data-bs-toggle="modal" data-bs-target="#historyModal"><i class="fas fa-notes-medical me-2"></i>Mi Historial Médico</button>
                            <button onclick="logout()" class="btn btn-outline-danger rounded-pill"><i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Citas y Actividad -->
            <div class="col-lg-8">
                <div class="custom-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0"><i class="fas fa-calendar-check text-primary me-2"></i>Mis Citas Próximas</h4>
                        <a href="appointments.html" class="btn btn-sm btn-primary rounded-pill">Nueva Cita</a>
                    </div>
                    
                    <div id="citas-container">
                        <p class="text-center text-muted py-3">Cargando citas...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Historial Médico -->
    <div class="modal fade" id="historyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-notes-medical text-primary me-2"></i>Mi Historial Médico</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="historyForm" onsubmit="guardarHistorial(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Enfermedades Crónicas (Ej. Hipertensión, Diabetes)</label>
                            <textarea id="hist-enfermedades" class="form-control" rows="2" placeholder="Ninguna"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Alergias a Medicamentos o Materiales</label>
                            <textarea id="hist-alergias" class="form-control" rows="2" placeholder="Ninguna"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Medicamentos Actuales</label>
                            <textarea id="hist-medicamentos" class="form-control" rows="2" placeholder="Ninguno"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Subir Radiografía / Estudios (Simulado)</label>
                            <input type="file" id="hist-radiografias" class="form-control">
                            <small class="text-muted">El archivo no se subirá realmente, pero se guardará su nombre de referencia.</small>
                            <div id="current-file" class="mt-2 text-primary small fw-bold"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill">Guardar Historial</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        // Cargar datos del usuario
        const user = checkSession(['usuario', 'doctor', 'admin']);
        if (!user) { /* Redirigido */ }
        document.getElementById('profile-name').innerText = user.nombre || user.name;
        document.getElementById('profile-email').innerText = user.email;

        // Cargar Citas
        async function cargarCitas() {
            const container = document.getElementById('citas-container');
            try {
                const res = await secureFetch('/api/citas');
                const todas = await res.json();
                const misCitas = todas.filter(c => c.id_paciente === user.id);
                
                if (misCitas.length === 0) {
                    container.innerHTML = '<p class="text-center text-muted py-3">No tienes citas programadas.</p>';
                    return;
                }

                container.innerHTML = misCitas.map(c => {
                    let badgeClass = 'bg-warning text-dark';
                    if (c.estado === 'Confirmada') badgeClass = 'bg-success';
                    if (c.estado === 'Cancelada') badgeClass = 'bg-danger';

                    return `
                    <div class="p-3 border rounded-4 bg-light mb-3">
                        <div class="d-flex justify-content-between align-items-center flex-wrap">
                            <div>
                                <h6 class="mb-1">${c.servicio}</h6>
                                <p class="text-muted small mb-0"><i class="far fa-clock me-2"></i>${c.fecha} - ${c.hora}</p>
                                ${c.notas ? `<p class="small text-muted mt-1 mb-0"><i class="fas fa-sticky-note me-1"></i>${c.notas}</p>` : ''}
                            </div>
                            <span class="badge ${badgeClass} px-3 rounded-pill">${c.estado}</span>
                        </div>
                    </div>`;
                }).join('');
            } catch (err) {
                container.innerHTML = '<p class="text-center text-danger py-3">Error al cargar citas.</p>';
            }
        }

        // Cargar Historial
        async function cargarHistorial() {
            try {
                const res = await secureFetch('/api/historias/' + user.id);
                const data = await res.json();
                if (data.id_paciente) {
                    document.getElementById('hist-enfermedades').value = data.enfermedades || '';
                    document.getElementById('hist-alergias').value = data.alergias || '';
                    document.getElementById('hist-medicamentos').value = data.medicamentos || '';
                    if (data.radiografias) {
                        document.getElementById('current-file').innerText = 'Archivo actual: ' + data.radiografias;
                    }
                }
            } catch (err) {}
        }

        async function guardarHistorial(e) {
            e.preventDefault();
            const enfermedades = document.getElementById('hist-enfermedades').value;
            const alergias = document.getElementById('hist-alergias').value;
            const medicamentos = document.getElementById('hist-medicamentos').value;
            
            const fileInput = document.getElementById('hist-radiografias');
            let radiografias = document.getElementById('current-file').innerText.replace('Archivo actual: ', '');
            if (fileInput.files.length > 0) {
                radiografias = fileInput.files[0].name;
            }

            try {
                const res = await secureFetch('/api/historias', {
                    method: 'POST',
                    body: JSON.stringify({
                        id_paciente: user.id,
                        enfermedades, alergias, medicamentos, radiografias
                    })
                });
                if (res.ok) {
                    alert('Historial actualizado correctamente');
                    bootstrap.Modal.getInstance(document.getElementById('historyModal')).hide();
                    cargarHistorial();
                } else {
                    alert('Error al guardar historial');
                }
            } catch (err) { alert('Error de conexión'); }
        }

        cargarCitas();
        cargarHistorial();
    </script>
</body>
</html>
