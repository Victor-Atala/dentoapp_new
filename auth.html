<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Care - Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="area"><ul class="circles"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul></div>
    <div id="navbar-placeholder"></div>

    <div class="container d-flex justify-content-center align-items-start" style="min-height:calc(100vh - 90px);">
        <div class="custom-card mt-4" style="max-width:460px;width:100%;">

            <div class="text-center mb-4">
                <div class="service-icon-wrap mx-auto mb-3" style="width:56px;height:56px;font-size:1.5rem;">
                    <i class="fas fa-tooth"></i>
                </div>
                <h2 class="mb-1">Bienvenido</h2>
                <p class="text-muted small">Accede o crea tu cuenta en DentoApp</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="tab-login" onclick="showTab('login')">
                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                </button>
                <button class="auth-tab-btn" id="tab-registro" onclick="showTab('registro')">
                    <i class="fas fa-user-plus me-2"></i>Registrarse
                </button>
            </div>

            <div id="auth-msg" class="mb-3" style="display:none;"></div>

            <!-- FORM LOGIN -->
            <div id="form-login">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" placeholder="tu@correo.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••">
                </div>
                <button class="btn btn-primary w-100 py-3" onclick="handleLogin()">
                    <i class="fas fa-arrow-right me-2"></i>Entrar al Portal
                </button>
                <p class="text-center mt-3 small text-muted">
                    Admin de prueba: <strong>admin@dental.com</strong> / <strong>admin123</strong>
                </p>
            </div>

            <!-- FORM REGISTRO -->
            <div id="form-registro" style="display:none;">
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" id="reg-nombre" class="form-control" placeholder="Tu nombre">
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="tu@correo.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Mínimo 6 caracteres">
                </div>
                <button class="btn btn-primary w-100 py-3" onclick="handleRegistro()">
                    <i class="fas fa-user-plus me-2"></i>Crear Cuenta
                </button>
            </div>

            <!-- FORM VERIFICACIÓN -->
            <div id="form-verificacion" style="display:none;">
                <div class="text-center mb-3">
                    <p class="text-muted">Hemos enviado un código de 6 dígitos a tu correo. Por favor ingrésalo a continuación.</p>
                </div>
                <div class="mb-4">
                    <label class="form-label">Código de Verificación</label>
                    <input type="text" id="verif-codigo" class="form-control text-center" placeholder="123456" style="font-size: 1.5rem; letter-spacing: 0.5rem;" maxlength="6">
                </div>
                <input type="hidden" id="verif-email">
                <button class="btn btn-success w-100 py-3" onclick="handleVerificacion()">
                    <i class="fas fa-check-circle me-2"></i>Verificar Cuenta
                </button>
                <button class="btn btn-link w-100 mt-2" onclick="showTab('login')">Volver al Login</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        function showTab(tab) {
            document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
            document.getElementById('form-registro').style.display = tab === 'registro' ? '' : 'none';
            document.getElementById('form-verificacion').style.display = tab === 'verificacion' ? '' : 'none';
            
            if (tab === 'verificacion') {
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('tab-registro').classList.remove('active');
            } else {
                document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
                document.getElementById('tab-registro').classList.toggle('active', tab === 'registro');
            }
            ocultarMsg();
        }

        function mostrarMsg(texto, tipo) {
            const el = document.getElementById('auth-msg');
            el.style.display = '';
            el.innerHTML = '<div class="alert alert-' + tipo + ' alert-dentoapp">' + texto + '</div>';
        }

        function ocultarMsg() { document.getElementById('auth-msg').style.display = 'none'; }

        async function handleLogin() {
            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            if (!email || !password) { mostrarMsg('Por favor completa todos los campos.', 'danger'); return; }
            try {
                const res  = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) { 
                    if (data.requiereVerificacion) {
                        mostrarMsg(data.error, 'warning');
                        document.getElementById('verif-email').value = email;
                        setTimeout(() => showTab('verificacion'), 1500);
                        return;
                    }
                    mostrarMsg(data.error || 'Credenciales incorrectas.', 'danger'); 
                    return; 
                }
                localStorage.setItem('currentUser', JSON.stringify(data.usuario));
                mostrarMsg('Acceso exitoso! Redirigiendo...', 'success');
                setTimeout(() => {
                    let nextUrl = 'index.html';
                    if (data.usuario.rol === 'admin') nextUrl = 'admin.html';
                    if (data.usuario.rol === 'doctor') nextUrl = 'doctor.html';
                    window.location.href = nextUrl;
                }, 800);
            } catch(err) { mostrarMsg('No se pudo conectar al servidor.', 'danger'); }
        }

        async function handleRegistro() {
            const nombre   = document.getElementById('reg-nombre').value.trim();
            const email    = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const rol      = 'usuario';
            if (!nombre || !email || !password) { mostrarMsg('Por favor completa todos los campos.', 'danger'); return; }
            if (password.length < 6) { mostrarMsg('La contrasena debe tener al menos 6 caracteres.', 'danger'); return; }
            try {
                const res  = await fetch('/api/registro', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ nombre, email, password, rol })
                });
                const data = await res.json();
                if (!res.ok) { mostrarMsg(data.error || 'Error al registrarse.', 'danger'); return; }
                mostrarMsg('¡Cuenta creada! Revisa tu correo para el código de verificación.', 'success');
                document.getElementById('verif-email').value = email;
                setTimeout(() => showTab('verificacion'), 1500);
            } catch(err) { mostrarMsg('No se pudo conectar al servidor.', 'danger'); }
        }

        async function handleVerificacion() {
            const email = document.getElementById('verif-email').value;
            const codigo = document.getElementById('verif-codigo').value.trim();
            if (!codigo) { mostrarMsg('Ingresa el código.', 'danger'); return; }
            try {
                const res = await fetch('/api/verificar', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email, codigo })
                });
                const data = await res.json();
                if (!res.ok) { mostrarMsg(data.error || 'Código incorrecto.', 'danger'); return; }
                mostrarMsg('¡Cuenta verificada exitosamente! Ya puedes iniciar sesión.', 'success');
                setTimeout(() => showTab('login'), 1500);
            } catch(err) { mostrarMsg('Error de conexión.', 'danger'); }
        }
    </script>
</body>
</html>
