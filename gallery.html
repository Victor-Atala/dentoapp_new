<!DOCTYPE html>
<html lang="es">
<head>

    <title>Dental Care - Galería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>
    <div class="area"><ul class="circles"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul></div>

            <p class="opacity-75">Resultados reales de pacientes que confiaron en nosotros.</p>
        </div>

        <div class="row g-4">
            <!-- Caso 1 -->
            <div class="col-md-4">
                <div class="custom-card p-2 h-100">
                    <img src="https://images.unsplash.com/photo-1606811841689-23dfddce3e95?auto=format&fit=crop&w=500&q=80" alt="Diseño de Sonrisa" class="img-fluid rounded-4 mb-3 w-100" style="height: 200px; object-fit: cover;">

                    </div>
                </div>
            </div>
            <!-- Caso 2 -->
            <div class="col-md-4">

                        <h6 class="fw-bold mb-1">Ortodoncia Invisible</h6>

                    </div>
                </div>
            </div>
            <!-- Caso 3 -->
            <div class="col-md-4">
                <div class="custom-card p-2 h-100">
                    <img src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=500&q=80" alt="Blanqueamiento LED" class="img-fluid rounded-4 mb-3 w-100" style="height: 200px; object-fit: cover;">

                        <h6 class="fw-bold mb-1">Blanqueamiento LED</h6>
