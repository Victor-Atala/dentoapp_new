<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Dental - Agendar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="area"><ul class="circles"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul></div>

    <div id="navbar-placeholder"></div>

    <section class="container py-5" style="margin-top: 50px;">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="section-card">
                    <div class="text-center mb-4">
                        <i class="fas fa-calendar-plus fa-3x text-primary mb-3"></i>
                        <h2>Reserva tu Espacio</h2>
                        <p class="text-muted">Completa los datos para solicitar una cita médica.</p>
                    </div>

                    <form id="appointmentForm" onsubmit="registerAppointment(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Servicio</label>
                            <select id="service" class="form-select" required>
                                <option value="" selected disabled>Selecciona un servicio...</option>
                                <option value="Limpieza Dental">Limpieza Dental</option>
                                <option value="Ortodoncia (Brackets)">Ortodoncia (Brackets)</option>
                                <option value="Blanqueamiento">Blanqueamiento</option>
                                <option value="Extracción">Extracción</option>
                                <option value="Implante Dental">Implante Dental</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Fecha</label>
                                <input type="date" id="date" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Hora Sugerida</label>
                                <input type="time" id="time" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Notas o Síntomas</label>
                            <textarea id="notes" class="form-control" rows="3" placeholder="Ej: Dolor en muela del juicio, revisión de brackets..."></textarea>
                        </div>

                        <div class="alert alert-info py-2">
                            <small><i class="fas fa-info-circle me-2"></i>Tu cita quedará en estado <strong>Pendiente</strong> hasta que el administrador la confirme.</small>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 mt-2 rounded-pill shadow">
                            <i class="fas fa-paper-plane me-2"></i>Enviar Solicitud
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="text-center py-4 text-white">
        <p>&copy; 2023 Consultorio Dental.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Configurar fecha mínima a hoy
            const dateInput = document.getElementById('date');
            const today = new Date().toISOString().split('T')[0];
            dateInput.setAttribute('min', today);

            // Configurar horas de trabajo sugeridas (ej: 08:00 a 18:00)
            const timeInput = document.getElementById('time');
            timeInput.setAttribute('min', '08:00');
            timeInput.setAttribute('max', '18:00');

            // Evitar que se escriban fechas/horas manuales inválidas en algunos navegadores
            dateInput.addEventListener('change', function() {
                if(this.value < today) this.value = today;
            });

            // Preseleccionar servicio si viene por URL (ej: ?service=implantes)
            const urlParams = new URLSearchParams(window.location.search);
            const serviceParam = urlParams.get('service');
            if (serviceParam) {
                const serviceSelect = document.getElementById('service');
                const options = Array.from(serviceSelect.options);
                const matchedOption = options.find(opt => opt.value.toLowerCase().includes(serviceParam.toLowerCase()));
                if (matchedOption) {
                    matchedOption.selected = true;
                }
            }
        });

        async function registerAppointment(e) {
            e.preventDefault();
            
            const user = checkSession(['usuario', 'doctor', 'admin']);
            if (!user) return;

            // Creamos el objeto de la cita
            const apt = {
                id_paciente: user.id,
                service: document.getElementById('service').value,
                fecha: document.getElementById('date').value,
                hora: document.getElementById('time').value,
                notas: document.getElementById('notes').value
            };

            // Guardamos en nuestra API
            await saveAppointment(apt); 

            // Feedback y redirección
            alert("¡Solicitud enviada! Podrás revisar el estado en tu perfil.");
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
