<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dental Care - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="area"><ul class="circles"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul></div>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <div class="row">
            <!-- Formulario -->
            <div class="col-lg-7">
                <div class="custom-card">
                    <h3 class="fw-bold mb-4">Escríbenos</h3>
                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Nombre</label>
                                <input type="text" class="form-control rounded-3" placeholder="Tu nombre">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Teléfono</label>
                                <input type="tel" class="form-control rounded-3" placeholder="Tu teléfono">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mensaje</label>
                            <textarea class="form-control rounded-3" rows="4" placeholder="¿En qué podemos ayudarte?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill shadow">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
            
            <!-- Info Contacto -->
            <div class="col-lg-5">
                <div class="custom-card text-white" style="background: linear-gradient(135deg, #0ea5e9, #6366f1);">
                    <h3 class="fw-bold mb-4">Información</h3>
                    <ul class="list-unstyled">
                        <li class="mb-4 d-flex align-items-center">
                            <i class="fas fa-map-marker-alt fa-lg me-3"></i>
                            <span>Av. Principal #123, Ciudad Dental</span>
                        </li>
                        <li class="mb-4 d-flex align-items-center">
                            <i class="fas fa-phone-alt fa-lg me-3"></i>
                            <span>+1 234 567 890</span>
                        </li>
                        <li class="mb-4 d-flex align-items-center">
                            <i class="fas fa-envelope fa-lg me-3"></i>
                            <span>contacto@dentalcare.com</span>
                        </li>
                    </ul>
                    <hr class="bg-white my-4">
                    <div class="d-flex justify-content-center gap-3">
                        <i class="fab fa-facebook fa-2x"></i>
                        <i class="fab fa-instagram fa-2x"></i>
                        <i class="fab fa-whatsapp fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
